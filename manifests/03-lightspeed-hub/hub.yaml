apiVersion: v1
kind: ServiceAccount
metadata:
  name: lightspeed-hub-controller
  namespace: openshift-lightspeed
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: lightspeed-hub-controller-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
- kind: ServiceAccount
  name: lightspeed-hub-controller
  namespace: openshift-lightspeed
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lightspeed-hub-controller
  namespace: openshift-lightspeed
  labels:
    app.kubernetes.io/name: lightspeed-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: lightspeed-hub
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lightspeed-hub
    spec:
      serviceAccountName: lightspeed-hub-controller
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: manager
        image: ${HUB_IMAGE}
        imagePullPolicy: Always
        command: ["/manager"]
        args:
        - --leader-elect
        - --health-probe-bind-address=:8081
        - --namespace=openshift-lightspeed
        - --alerts-adapter-image=${AAA_IMAGE}
        ports:
        - name: health
          containerPort: 8081
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
---
apiVersion: hub.openshift.io/v1alpha1
kind: HubConfig
metadata:
  name: cluster
spec:
  clusterRegistryMode: secret
