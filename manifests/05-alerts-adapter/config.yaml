pollInterval: "45s"
preRunDelay: "10m"
postRunDelay: "2h"
filtering:
  allowedReceivers:
  - critical
deduplication:
  ignoredLabels:
  - pod
  - instance
  - endpoint
  - uid
tools:
  skills:
  - image: quay.io/openshiftanalytics/agentic-skills:latest
    paths:
    - /skills/cluster-troubleshoot/investigate-alert
