# MCE operator subscription for a fresh install. Channel is overridable via
# MCE_CHANNEL in .env; startingCSV is intentionally omitted so the channel's
# current CSV resolves instead of pinning a stale one.
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: multicluster-engine
  namespace: multicluster-engine
spec:
  channel: ${MCE_CHANNEL}
  installPlanApproval: Automatic
  name: multicluster-engine
  source: redhat-operators
  sourceNamespace: openshift-marketplace
